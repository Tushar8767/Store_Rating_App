name: Store Rating App - DevOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Backend Test & Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: store_rating
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend Test Pipeline
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Database Migrations & Seeds
        working-directory: ./backend
        env:
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DB_NAME: store_rating
          JWT_SECRET: ci_secret_jwt_key_2026
        run: npm run db:setup

      - name: Execute Automated Backend Test Suite
        working-directory: ./backend
        env:
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DB_NAME: store_rating
          JWT_SECRET: ci_secret_jwt_key_2026
        run: npm test

      # Frontend Build Pipeline
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React Application
        working-directory: ./frontend
        run: npm run build

      # Docker Build Verification
      - name: Validate Backend Docker Build
        run: docker build -t store-rating-backend:ci ./backend

      - name: Validate Frontend Docker Build
        run: docker build -t store-rating-frontend:ci ./frontend
