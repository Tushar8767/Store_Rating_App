events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'upstream_status: $upstream_status response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream definition for load balancing across Express API instances
    # max_fails and fail_timeout configure automatic fault detection and recovery
    upstream backend_servers {
        server backend-1:5000 max_fails=2 fail_timeout=5s;
        server backend-2:5000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health endpoint on reverse proxy itself
        location /lb-health {
            access_log off;
            return 200 '{"status":"UP","component":"nginx-load-balancer"}\n';
            add_header Content-Type application/json;
        }

        # Reverse proxy API requests to load-balanced Express backends
        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_http_version 1.1;

            # Header forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover: if one instance fails or errors, try next immediately
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Timeouts
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Serve React frontend
        location / {
            proxy_pass http://frontend:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
